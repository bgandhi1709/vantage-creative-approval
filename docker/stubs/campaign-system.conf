# Stand-in for the upstream campaign system, for local runs only.
#
# It answers the two calls the API makes: read the open stages, and advance to the next one. The
# read always reports InProduction, which is the predecessor the submit path expects, so a local
# walkthrough exercises the real transition logic rather than a bypass.

server {
    listen 80;
    server_name _;

    location ~ ^/campaigns/[^/]+/stages$ {
        default_type application/json;

        if ($request_method = POST) {
            return 200 '{"accepted":true}';
        }

        return 200 '{"campaignId":"00000000-0000-0000-0000-000000000000","openStages":["InProduction"]}';
    }

    location / {
        return 404;
    }
}
